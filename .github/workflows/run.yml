name: MATLAB power electronics experiments
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Experiment suite
        default: smoke
        type: choice
        options: [smoke, full, physical]
jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@v4
      - name: Start virtual display
        run: Xvfb :99 -screen 0 1600x1100x24 > /tmp/pe-display.log 2>&1 &
      - name: Set up MathWorks tools
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Build and run six circuits
        uses: matlab-actions/run-command@v2
        with:
          command: if strcmp('${{ inputs.mode }}','physical'), pe_sps_run; else, pe_run('${{ inputs.mode }}'); end
      - name: Preserve MATLAB results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pe-run-results
          path: |
            pe_live_results.zip
            pe_physical_results.zip
            diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
